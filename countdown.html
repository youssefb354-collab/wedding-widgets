<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Countdown</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="w.css"><script src="w.js"></script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 3vw; text-align: center; }
  .title { font-family: var(--fs); color: var(--accent); font-size: clamp(26px, 9vw, 64px); line-height: 1; margin: 0 0 3vw; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(6px, 2.4vw, 20px); width: min(100%, 680px); margin: 0 auto; }
  .cell { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(10px, 3.4vw, 26px) 4px; }
  [data-style="arch"] .cell { border-radius: 999px 999px 14px 14px; padding-top: clamp(16px, 5vw, 34px); }
  [data-style="minimal"] .cell { background: transparent; border: 0; border-right: 1px solid var(--line); border-radius: 0; }
  [data-style="minimal"] .cell:last-child { border-right: 0; }
  .num { font-family: var(--fd); font-size: clamp(26px, 10vw, 68px); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .lab { font-size: clamp(9px, 2.1vw, 12.5px); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); margin-top: 1.6vw; }
  .done { font-family: var(--fi); font-style: italic; font-size: clamp(20px, 5.4vw, 38px); }
  .date { margin-top: 3vw; font-size: clamp(11px, 2.4vw, 14px); letter-spacing: .24em; text-transform: uppercase; color: var(--soft); }
</style></head>
<body><main id="w"></main>
<script>
  const { P, zoned, esc, t, fail } = W;
  const L = t({ en: { d: "Days", h: "Hours", m: "Minutes", s: "Seconds", today: "Today is the day!", married: "We’re married — thank you for celebrating with us!" },
                fr: { d: "Jours", h: "Heures", m: "Minutes", s: "Secondes", today: "C’est aujourd’hui !", married: "Nous sommes mariés — merci d’avoir fêté ce jour avec nous !" },
                es: { d: "Días", h: "Horas", m: "Minutos", s: "Segundos", today: "¡Hoy es el día!", married: "¡Nos casamos! Gracias por celebrar con nosotros." },
                de: { d: "Tage", h: "Stunden", m: "Minuten", s: "Sekunden", today: "Heute ist der Tag!", married: "Wir haben geheiratet – danke, dass ihr mit uns gefeiert habt!" },
                it: { d: "Giorni", h: "Ore", m: "Minuti", s: "Secondi", today: "È il grande giorno!", married: "Ci siamo sposati — grazie per aver festeggiato con noi!" } });
  document.documentElement.setAttribute("data-style", P.get("style") || "boxes");
  const start = zoned(P.get("date"), P.get("tz")); const end = new Date((start?.getTime() || 0) + 12 * 36e5);
  const box = document.getElementById("w");
  if (!start || isNaN(start)) fail("Add your wedding date to the link, e.g. ?date=2027-06-12T16:00&tz=Europe/Paris");
  else {
    box.innerHTML = `${P.get("title") ? `<p class="title">${esc(P.get("title"))}</p>` : ""}<div class="grid" role="timer" aria-live="off">
      ${["d", "h", "m", "s"].map((k) => `<div class="cell"><div class="num" id="${k}">00</div><div class="lab">${L[k]}</div></div>`).join("")}</div>
      ${P.get("showdate") === "1" ? `<div class="date">${esc(new Intl.DateTimeFormat(document.documentElement.lang, { dateStyle: "full", timeZone: P.get("tz") || undefined }).format(start))}</div>` : ""}`;
    const tick = () => {
      const now = Date.now(), diff = start - now;
      if (diff <= 0) { box.innerHTML = `<p class="done">${esc(now < end ? (P.get("todaymsg") || L.today) : (P.get("donemsg") || L.married))}</p>`; clearInterval(iv); return; }
      const v = { d: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5) % 24, m: Math.floor(diff / 6e4) % 60, s: Math.floor(diff / 1e3) % 60 };
      for (const k in v) document.getElementById(k).textContent = String(v[k]).padStart(2, "0");
    };
    const iv = setInterval(tick, 1000); tick();
  }
</script></body></html>
