<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Music</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="w.css"><script src="w.js"></script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 8px; }
  .player { display: inline-flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 20px 8px 8px; max-width: 100%; }
  .play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btnInk); display: grid; place-items: center; cursor: pointer; flex: none; }
  .play svg { width: 22px; height: 22px; }
  .meta { min-width: 0; text-align: left; }
  .meta b { display: block; font-family: var(--fd); font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta small { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--soft); }
  .bars { display: flex; gap: 3px; align-items: flex-end; height: 18px; margin-left: 4px; }
  .bars i { width: 3px; background: var(--accent); height: 30%; border-radius: 2px; }
  .on .bars i { animation: eq 1s ease-in-out infinite; } .bars i:nth-child(2) { animation-delay: .2s } .bars i:nth-child(3) { animation-delay: .4s } .bars i:nth-child(4) { animation-delay: .1s }
  @keyframes eq { 50% { height: 100%; } }
  [data-look="icon"] .player { padding: 0; border: 0; background: none; } [data-look="icon"] .meta, [data-look="icon"] .bars { display: none; }
</style></head>
<body><div class="player" id="p"><button class="play" id="b" aria-label="Play music"></button><div class="meta"><b id="ti"></b><small id="st"></small></div><div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
<audio id="a" loop preload="none"></audio>
<script>
  const { P, t } = W;
  const L = t({ en: { play: "Tap to play", pause: "Playing", title: "Our song" }, fr: { play: "Touchez pour écouter", pause: "En lecture", title: "Notre chanson" },
                es: { play: "Toca para escuchar", pause: "Sonando", title: "Nuestra canción" }, de: { play: "Zum Abspielen tippen", pause: "Läuft", title: "Unser Lied" }, it: { play: "Tocca per ascoltare", pause: "In riproduzione", title: "La nostra canzone" } });
  // Built-in royalty-free tracks (hosted with the widgets) or any direct .mp3 link via ?src=
  const TRACKS = { romance: "audio/romance.mp3" };
  const src = P.get("src") || TRACKS[P.get("track") || "romance"];
  document.documentElement.setAttribute("data-look", P.get("look") || "pill");
  const a = document.getElementById("a"), b = document.getElementById("b"), p = document.getElementById("p");
  a.src = src; a.volume = Math.min(1, Math.max(0, +(P.get("vol") || .6)));
  document.getElementById("ti").textContent = P.get("title") || L.title;
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>';
  const ui = () => { const on = !a.paused; b.innerHTML = on ? PAUSE : PLAY; b.setAttribute("aria-label", on ? "Pause music" : "Play music"); p.classList.toggle("on", on); document.getElementById("st").textContent = on ? L.pause : L.play; };
  b.addEventListener("click", () => { if (a.paused) a.play().catch(() => {}); else a.pause(); });
  a.addEventListener("play", ui); a.addEventListener("pause", ui); a.addEventListener("error", () => { document.getElementById("st").textContent = "⚠️ song link not found"; });
  ui();
</script></body></html>
